name: GlobalCall Android

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/globalcall-android.yml'
  push:
    branches:
      - feature/global-video-calling-app

concurrency:
  group: globalcall-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build optimized debug APKs
        run: gradle --no-daemon assembleDebug
      - name: List APK sizes
        run: ls -lh app/build/outputs/apk/debug/*.apk
      - name: Upload optimized APKs
        uses: actions/upload-artifact@v4
        with:
          name: globalcall-v1.0.0-stable-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
