name: Apply GlobalCall v1.9.1 messaging UI patch

on:
  push:
    branches:
      - feature/global-video-calling-app
    paths:
      - '.github/workflows/v191-messaging-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/global-video-calling-app
          fetch-depth: 0

      - name: Apply v1.9.1 source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"Expected block not found in {path}: {old[:100]!r}")
              s = s.replace(old, new, 1)
              p.write_text(s)

          # 1) Make core message delivery independent from optional conversation metadata.
          chat_repo = 'app/src/main/java/com/globalcall/app/data/ChatRepository.kt'
          old = '''        val conversation = db.collection("conversations").document(id)\n        val message = conversation.collection("messages").document()\n        val batch = db.batch()\n\n        batch.set(\n            conversation,\n            mapOf(\n                "participantUids" to participants,\n                "lastMessage" to clean.take(180),\n                "lastSenderUid" to uid,\n                "unreadFor" to listOf(peerUid),\n                "typingUid" to "",\n                "typingAt" to FieldValue.serverTimestamp(),\n                "updatedAt" to FieldValue.serverTimestamp()\n            ),\n            SetOptions.merge()\n        )\n        batch.set(\n            message,\n            mapOf(\n                "senderUid" to uid,\n                "receiverUid" to peerUid,\n                "text" to clean,\n                "createdAt" to FieldValue.serverTimestamp()\n            )\n        )\n        batch.commit().await()\n'''
          new = '''        val conversation = db.collection("conversations").document(id)\n        val message = conversation.collection("messages").document()\n\n        // Keep the security-critical message write separate from optional UI metadata.\n        // Older deployed rules may reject typing/unread metadata even though the message\n        // itself is allowed. A metadata rejection must not roll back a valid message.\n        val conversationSnapshot = conversation.get().await()\n        if (!conversationSnapshot.exists()) {\n            conversation.set(\n                mapOf("participantUids" to participants),\n                SetOptions.merge()\n            ).await()\n        }\n\n        message.set(\n            mapOf(\n                "senderUid" to uid,\n                "receiverUid" to peerUid,\n                "text" to clean,\n                "createdAt" to FieldValue.serverTimestamp()\n            )\n        ).await()\n\n        runCatching {\n            conversation.set(\n                mapOf(\n                    "participantUids" to participants,\n                    "lastMessage" to clean.take(180),\n                    "lastSenderUid" to uid,\n                    "unreadFor" to listOf(peerUid),\n                    "typingUid" to "",\n                    "typingAt" to FieldValue.serverTimestamp(),\n                    "updatedAt" to FieldValue.serverTimestamp()\n                ),\n                SetOptions.merge()\n            ).await()\n        }\n'''
          replace_once(chat_repo, old, new)

          # 2) Make Block/Mute visible in the chat UI and show a useful permission error.
          chat_activity = 'app/src/main/java/com/globalcall/app/ChatActivity.kt'
          old = '''                    IconButton(enabled = !blockedByMe, onClick = { startCall(true) }) {\n                        Icon(Icons.Default.Videocam, "Video call")\n                    }\n                    Box {\n'''
          new = '''                    IconButton(enabled = !blockedByMe, onClick = { startCall(true) }) {\n                        Icon(Icons.Default.Videocam, "Video call")\n                    }\n                    IconButton(\n                        onClick = {\n                            if (blockedByMe) {\n                                scope.launch {\n                                    runCatching { callRepository.unblockUser(peerUid) }\n                                        .onSuccess { blockedByMe = false; info = "$peerName unblocked"; error = null }\n                                        .onFailure { error = it.message ?: "Could not unblock contact" }\n                                }\n                            } else {\n                                showBlockDialog = true\n                            }\n                        }\n                    ) {\n                        Icon(\n                            if (blockedByMe) Icons.Default.LockOpen else Icons.Default.Block,\n                            if (blockedByMe) "Unblock contact" else "Block contact"\n                        )\n                    }\n                    Box {\n'''
          replace_once(chat_activity, old, new)

          old = '''        ) {\n            if (blockedByMe) {\n'''
          new = '''        ) {\n            if (!blockedByMe) {\n                Surface(color = MaterialTheme.colorScheme.surfaceVariant.copy(alpha = .55f)) {\n                    Row(\n                        Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 4.dp),\n                        verticalAlignment = Alignment.CenterVertically\n                    ) {\n                        Text(\n                            "Contact controls",\n                            modifier = Modifier.weight(1f),\n                            style = MaterialTheme.typography.labelMedium,\n                            color = MaterialTheme.colorScheme.onSurfaceVariant\n                        )\n                        TextButton(onClick = {\n                            muted = !muted\n                            callRepository.setContactMuted(peerUid, muted)\n                            info = if (muted) "Message notifications muted" else "Message notifications unmuted"\n                        }) {\n                            Icon(\n                                if (muted) Icons.Default.Notifications else Icons.Default.NotificationsOff,\n                                null,\n                                modifier = Modifier.size(18.dp)\n                            )\n                            Spacer(Modifier.width(4.dp))\n                            Text(if (muted) "Unmute" else "Mute")\n                        }\n                        TextButton(onClick = { showBlockDialog = true }) {\n                            Icon(Icons.Default.Block, null, modifier = Modifier.size(18.dp))\n                            Spacer(Modifier.width(4.dp))\n                            Text("Block")\n                        }\n                    }\n                }\n            }\n            if (blockedByMe) {\n'''
          replace_once(chat_activity, old, new)

          old = '''                                    .onSuccess { draft = ""; error = null }\n                                    .onFailure { error = it.message ?: "Could not send message" }\n'''
          new = '''                                    .onSuccess { draft = ""; error = null }\n                                    .onFailure { error = friendlyChatError(it) }\n'''
          replace_once(chat_activity, old, new)

          marker = '''@Composable\nprivate fun PeerAvatar(photoData: String, name: String, size: Dp) {\n'''
          helper = '''private fun friendlyChatError(throwable: Throwable): String {\n    val raw = throwable.message.orEmpty()\n    return when {\n        raw.contains("PERMISSION_DENIED", ignoreCase = true) ||\n            raw.contains("insufficient permissions", ignoreCase = true) ->\n            "Messaging access is not synced with Firebase yet. Publish the latest GlobalCall Firestore rules, then try again."\n        raw.contains("network", ignoreCase = true) || raw.contains("unavailable", ignoreCase = true) ->\n            "Message could not reach GlobalCall. Check internet and try again."\n        raw.isNotBlank() -> raw\n        else -> "Could not send message"\n    }\n}\n\n@Composable\nprivate fun PeerAvatar(photoData: String, name: String, size: Dp) {\n'''
          replace_once(chat_activity, marker, helper)

          # 3) Add a real Settings tab to the main bottom navigation.
          home = 'app/src/main/java/com/globalcall/app/ui/ReadyHomeScreen.kt'
          replace_once(home,
              'import com.globalcall.app.MainActivity\n',
              'import com.globalcall.app.MainActivity\nimport com.globalcall.app.PrivacySettingsActivity\nimport com.globalcall.app.BuildConfig\n')
          replace_once(home,
              'import com.globalcall.app.model.CallSession\n',
              'import com.globalcall.app.model.CallSession\nimport com.globalcall.app.ui.theme.ThemeMode\nimport com.globalcall.app.ui.theme.ThemePreferences\n')

          old = '''                    2 -> PeopleTab(\n                        people = people,\n                        busy = busy,\n                        repository = repository,\n                        discoveryRepository = discoveryRepository,\n                        onDirectCall = ::directCall,\n                        onMessage = ::openChat\n                    )\n                    else -> ProfileTab(\n                        auth = auth,\n                        repository = repository,\n                        discoveryRepository = discoveryRepository,\n                        profile = myProfile,\n                        callCode = myCallCode,\n                        username = myUsername,\n                        onUsernameChanged = { myUsername = it },\n                        onMessage = { message = it }\n                    )\n'''
          new = '''                    2 -> PeopleTab(\n                        people = people,\n                        busy = busy,\n                        repository = repository,\n                        discoveryRepository = discoveryRepository,\n                        onDirectCall = ::directCall,\n                        onMessage = ::openChat\n                    )\n                    3 -> ProfileTab(\n                        auth = auth,\n                        repository = repository,\n                        discoveryRepository = discoveryRepository,\n                        profile = myProfile,\n                        callCode = myCallCode,\n                        username = myUsername,\n                        onUsernameChanged = { myUsername = it },\n                        onMessage = { message = it }\n                    )\n                    else -> SettingsTab(\n                        auth = auth,\n                        repository = repository,\n                        onMessage = { message = it }\n                    )\n'''
          replace_once(home, old, new)

          old = '''        NavigationBarItem(selected == 2, { onSelected(2) }, { Icon(Icons.Default.Groups, null) }, label = { Text("People") })\n        NavigationBarItem(selected == 3, { onSelected(3) }, { Icon(Icons.Default.AccountCircle, null) }, label = { Text("Profile") })\n'''
          new = '''        NavigationBarItem(selected == 2, { onSelected(2) }, { Icon(Icons.Default.Groups, null) }, label = { Text("People") })\n        NavigationBarItem(selected == 3, { onSelected(3) }, { Icon(Icons.Default.AccountCircle, null) }, label = { Text("Profile") })\n        NavigationBarItem(selected == 4, { onSelected(4) }, { Icon(Icons.Default.Settings, null) }, label = { Text("Settings") })\n'''
          replace_once(home, old, new)

          marker = '''@Composable\nprivate fun IncomingOverlay(\n'''
          settings_tab = '''@Composable\nprivate fun SettingsTab(\n    auth: FirebaseAuth,\n    repository: GlobalCallRepository,\n    onMessage: (String) -> Unit\n) {\n    val context = LocalContext.current\n    val scope = rememberCoroutineScope()\n\n    LazyColumn(\n        Modifier.fillMaxSize(),\n        contentPadding = PaddingValues(20.dp),\n        verticalArrangement = Arrangement.spacedBy(14.dp)\n    ) {\n        item {\n            Text("Settings", style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.ExtraBold)\n            Text(\n                "Privacy, notifications, appearance and call health",\n                color = MaterialTheme.colorScheme.onSurfaceVariant\n            )\n        }\n        item {\n            ElevatedCard(\n                onClick = { context.startActivity(Intent(context, PrivacySettingsActivity::class.java)) },\n                shape = RoundedCornerShape(22.dp)\n            ) {\n                Row(\n                    Modifier.fillMaxWidth().padding(18.dp),\n                    verticalAlignment = Alignment.CenterVertically\n                ) {\n                    Icon(Icons.Default.Security, null, tint = MaterialTheme.colorScheme.primary)\n                    Spacer(Modifier.width(12.dp))\n                    Column(Modifier.weight(1f)) {\n                        Text("Privacy & blocked users", fontWeight = FontWeight.Bold)\n                        Text("Unblock users and manage muted contacts", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)\n                    }\n                    Icon(Icons.Default.ChevronRight, null)\n                }\n            }\n        }\n        item {\n            ElevatedCard(shape = RoundedCornerShape(22.dp)) {\n                Column(Modifier.fillMaxWidth().padding(18.dp)) {\n                    Row(verticalAlignment = Alignment.CenterVertically) {\n                        Icon(Icons.Default.Palette, null, tint = MaterialTheme.colorScheme.primary)\n                        Spacer(Modifier.width(10.dp))\n                        Text("Appearance", fontWeight = FontWeight.Bold)\n                    }\n                    Spacer(Modifier.height(12.dp))\n                    Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {\n                        FilterChip(\n                            selected = ThemePreferences.mode == ThemeMode.SYSTEM,\n                            onClick = { ThemePreferences.setMode(context.applicationContext, ThemeMode.SYSTEM) },\n                            label = { Text("System") },\n                            modifier = Modifier.weight(1f)\n                        )\n                        FilterChip(\n                            selected = ThemePreferences.mode == ThemeMode.LIGHT,\n                            onClick = { ThemePreferences.setMode(context.applicationContext, ThemeMode.LIGHT) },\n                            label = { Text("Light") },\n                            modifier = Modifier.weight(1f)\n                        )\n                        FilterChip(\n                            selected = ThemePreferences.mode == ThemeMode.DARK,\n                            onClick = { ThemePreferences.setMode(context.applicationContext, ThemeMode.DARK) },\n                            label = { Text("Dark") },\n                            modifier = Modifier.weight(1f)\n                        )\n                    }\n                }\n            }\n        }\n        item {\n            ElevatedCard(shape = RoundedCornerShape(22.dp)) {\n                Column(Modifier.fillMaxWidth().padding(18.dp)) {\n                    Row(verticalAlignment = Alignment.CenterVertically) {\n                        Icon(Icons.Default.Notifications, null, tint = MaterialTheme.colorScheme.primary)\n                        Spacer(Modifier.width(10.dp))\n                        Column(Modifier.weight(1f)) {\n                            Text("Notifications", fontWeight = FontWeight.Bold)\n                            Text("Incoming calls and messages need Android notifications enabled.", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)\n                        }\n                    }\n                    Spacer(Modifier.height(10.dp))\n                    OutlinedButton(\n                        onClick = {\n                            val intent = Intent(android.provider.Settings.ACTION_APP_NOTIFICATION_SETTINGS).apply {\n                                putExtra(android.provider.Settings.EXTRA_APP_PACKAGE, context.packageName)\n                            }\n                            context.startActivity(intent)\n                        },\n                        modifier = Modifier.fillMaxWidth()\n                    ) { Text("Open notification settings") }\n                }\n            }\n        }\n        item {\n            ElevatedCard(shape = RoundedCornerShape(22.dp)) {\n                Column(Modifier.fillMaxWidth().padding(18.dp)) {\n                    Row(verticalAlignment = Alignment.CenterVertically) {\n                        Icon(Icons.Default.BuildCircle, null, tint = MaterialTheme.colorScheme.primary)\n                        Spacer(Modifier.width(10.dp))\n                        Column(Modifier.weight(1f)) {\n                            Text("Call status repair", fontWeight = FontWeight.Bold)\n                            Text("Clears a stale Busy / On another call state when no real call is alive.", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)\n                        }\n                    }\n                    Spacer(Modifier.height(10.dp))\n                    OutlinedButton(\n                        onClick = {\n                            scope.launch {\n                                runCatching { repository.repairMyCallState() }\n                                    .onSuccess { onMessage("Call status checked and repaired") }\n                                    .onFailure { onMessage(it.message ?: "Could not repair call status") }\n                            }\n                        },\n                        modifier = Modifier.fillMaxWidth()\n                    ) { Text("Repair call status") }\n                }\n            }\n        }\n        item {\n            Text(\n                "GlobalCall ${BuildConfig.VERSION_NAME}",\n                style = MaterialTheme.typography.labelMedium,\n                color = MaterialTheme.colorScheme.onSurfaceVariant\n            )\n        }\n        item {\n            OutlinedButton(\n                onClick = {\n                    scope.launch {\n                        runCatching { repository.setOnline(false) }\n                        auth.signOut()\n                    }\n                },\n                modifier = Modifier.fillMaxWidth()\n            ) {\n                Icon(Icons.Default.Logout, null)\n                Spacer(Modifier.width(8.dp))\n                Text("Sign out")\n            }\n        }\n    }\n}\n\n@Composable\nprivate fun IncomingOverlay(\n'''
          replace_once(home, marker, settings_tab)

          # 4) Version bump.
          gradle = Path('app/build.gradle.kts')
          s = gradle.read_text()
          if 'versionCode = 27' not in s or 'versionName = "1.9.0"' not in s:
              raise SystemExit('Expected v1.9.0 version block not found')
          s = s.replace('versionCode = 27', 'versionCode = 28', 1)
          s = s.replace('versionName = "1.9.0"', 'versionName = "1.9.1"', 1)
          gradle.write_text(s)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "GlobalCall CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/globalcall/app/data/ChatRepository.kt \
                  app/src/main/java/com/globalcall/app/ChatActivity.kt \
                  app/src/main/java/com/globalcall/app/ui/ReadyHomeScreen.kt \
                  app/build.gradle.kts
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "fix: GlobalCall v1.9.1 messaging permissions and settings UX"
            git push origin HEAD:feature/global-video-calling-app
          fi
