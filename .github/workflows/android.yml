name: Build Guide Android APK

on:
  push:
    branches:
      - feature/guide-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch or tag to build
        required: true
        default: feature/guide-v1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guide-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
