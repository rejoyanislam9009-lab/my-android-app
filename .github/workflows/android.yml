name: Build Guide Android APK

on:
  push:
    branches:
      - feature/guide-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Patch Kotlin shadowed text assignments
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/guide/app/MainActivity.kt')
          text = path.read_text()
          text = text.replace('            text = "−"', '            this.text = "−"')
          text = text.replace('            text = "+"', '            this.text = "+"')
          text = text.replace('            text = "›"', '            this.text = "›"')
          path.write_text(text)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guide-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
