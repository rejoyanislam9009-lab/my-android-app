name: Guide v2.5 temporary patcher

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-guide-v25:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Guide feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/guide-v2
          fetch-depth: 0

      - name: Apply source patch
        shell: bash
        run: |
          python3 .github/scripts/v25_patch.py
          if git diff --quiet -- app/src/main/java/com/guide/app/MainActivity.kt; then
            echo "Guide v2.5 patch already applied"
            exit 0
          fi
          git config user.name "guide-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- app/src/main/java/com/guide/app/MainActivity.kt
          git commit -m "feat: finish Guide v2.5 UI and location fixes [v25-main]"
          git push origin HEAD:feature/guide-v2
