name: Guide v2.4 one-shot source fix

on:
  push:
    branches:
      - feature/guide-v2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v24-autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/guide-v2
          fetch-depth: 0
      - name: Patch MainActivity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/guide/app/MainActivity.kt')
          s = p.read_text()
          old = '''        val ringtoneButton = pillButton("রিংটোন: ${ringtoneTitle(selectedRingtone)}", "#34466F") {
              pickRingtone(selectedRingtone) { uri ->
                  selectedRingtone = uri
                  ringtoneButton.text = "রিংটোন: ${ringtoneTitle(uri)}"
              }
          }'''
          new = '''        lateinit var ringtoneButton: Button
          ringtoneButton = pillButton("রিংটোন: ${ringtoneTitle(selectedRingtone)}", "#34466F") {
              pickRingtone(selectedRingtone) { uri ->
                  selectedRingtone = uri
                  ringtoneButton.text = "রিংটোন: ${ringtoneTitle(uri)}"
              }
          }'''
          if old not in s:
              raise SystemExit('ringtoneButton pattern not found')
          s = s.replace(old, new, 1)
          old2 = '''        return when { hours > 0 -> String.format(Locale.getDefault(), "%dঘ %02দমি %02দসে", hours, minutes, secs).replace("দমি", "মি").replace("দসে", "সে"); minutes > 0 -> String.format(Locale.getDefault(), "%dমি %02দসে", minutes, secs).replace("দসে", "সে"); else -> String.format(Locale.getDefault(), "%dসে", secs) }'''
          new2 = '''        return when {
              hours > 0 -> "${hours}ঘ ${minutes.toString().padStart(2, '0')}মি ${secs.toString().padStart(2, '0')}সে"
              minutes > 0 -> "${minutes}মি ${secs.toString().padStart(2, '0')}সে"
              else -> "${secs}সে"
          }'''
          if old2 not in s:
              raise SystemExit('remainingText pattern not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/v24-autofix.yml
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "guide-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/guide/app/MainActivity.kt .github/workflows/v24-autofix.yml
          git commit -m "fix: compile Guide v2.4 [v24-autofix]"
          git push origin HEAD:feature/guide-v2
