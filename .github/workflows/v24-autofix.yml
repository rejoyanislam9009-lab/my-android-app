name: Guide v2.4 one-shot source fix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'feature/guide-v2' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/guide-v2
          fetch-depth: 0
      - name: Patch MainActivity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/guide/app/MainActivity.kt')
          s = p.read_text()
          token = 'val ringtoneButton = pillButton'
          if token not in s:
              raise SystemExit('ringtoneButton token not found')
          s = s.replace(token, 'lateinit var ringtoneButton: Button\n        ringtoneButton = pillButton', 1)
          lines = s.splitlines()
          replaced = False
          for i, line in enumerate(lines):
              if 'return when { hours > 0 -> String.format' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[i:i+1] = [
                      indent + 'return when {',
                      indent + '    hours > 0 -> "${hours}ঘ ${minutes.toString().padStart(2, \'0\')}মি ${secs.toString().padStart(2, \'0\')}সে"',
                      indent + '    minutes > 0 -> "${minutes}মি ${secs.toString().padStart(2, \'0\')}সে"',
                      indent + '    else -> "${secs}সে"',
                      indent + '}'
                  ]
                  replaced = True
                  break
          if not replaced:
              raise SystemExit('remainingText line not found')
          p.write_text('\n'.join(lines) + '\n')
          PY
          rm -f .github/workflows/v24-autofix.yml
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "guide-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/guide/app/MainActivity.kt .github/workflows/v24-autofix.yml
          git commit -m "fix: compile Guide v2.4 [v24-autofix]"
          git push origin HEAD:feature/guide-v2
