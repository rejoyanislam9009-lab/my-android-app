name: Build Guide v2 APK

on:
  push:
    branches:
      - feature/guide-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply Guide v2.5 source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/v25_patch.py')
          s = p.read_text()
          start = "rep('        labels.addView(text(record.status, 15f,"
          if start in s:
              line_start = s.index(start)
              line_end = s.index("\n", line_start)
              s = s[:line_start] + "s = s.replace('labels.addView(text(record.status, 15f', 'labels.addView(text(statusBn(record.status), 15f', 1)" + s[line_end:]
              p.write_text(s)
          PY
          python3 .github/scripts/v25_patch.py

      - name: Apply Guide v2.7 auth and sidebar patch
        run: python3 .github/scripts/v27_patch.py
      - name: Apply Guide v2.8 dashboard banner patch
        run: python3 .github/scripts/v28_patch.py
      - name: Apply Guide v2.9 daily life patch
        run: python3 .github/scripts/v29_patch.py
      - name: Apply Guide v3.0 guest and login UX patch
        run: python3 .github/scripts/v30_patch.py
      - name: Apply Guide v3.1 attendance wage patch
        run: python3 .github/scripts/v31_patch.py
      - name: Apply Guide v3.2 opt-in reminder patch
        run: python3 .github/scripts/v32_patch.py
      - name: Apply Guide v3.3 reset quick controls and pull refresh patch
        run: python3 .github/scripts/v33_patch.py
      - name: Apply Guide v3.4 alarm indicator and layout fixes
        run: python3 .github/scripts/v34_patch.py
      - name: Apply Guide v3.5 one-shot alarm repeat controls
        run: python3 .github/scripts/v35_patch.py
      - name: Apply Guide v3.6 bundled adhan ringtone patch
        run: python3 .github/scripts/v36_patch.py
      - name: Apply Guide v3.7 ringtone preview patch
        run: python3 .github/scripts/v37_patch.py
      - name: Apply Guide v3.8 media-routed preview patch
        run: python3 .github/scripts/v38_patch.py
      - name: Apply Guide v3.9 premium 3D UI patch
        run: python3 .github/scripts/v39_patch.py
      - name: Apply Guide v3.10 media volume and image carousel patch
        run: python3 .github/scripts/v310_patch.py
      - name: Apply Guide v3.11 interactive carousel and shine patch
        run: python3 .github/scripts/v311_patch.py
      - name: Apply Guide v3.12 swipe and contextual voice reminder patch
        run: python3 .github/scripts/v312_patch.py
      - name: Apply Guide v3.13 responsive sidebar and dashboard polish patch
        run: python3 .github/scripts/v313_patch.py
      - name: Apply Guide v3.13 compile-scope fix
        run: python3 .github/scripts/v313_compile_fix.py
      - name: Apply Guide v3.14 fixed-width rainbow gradient border patch
        run: python3 .github/scripts/v314_patch.py
      - name: Apply Guide v3.15 login UX Google auth and missing border patch
        run: python3 .github/scripts/v315_patch.py
      - name: Apply Guide v3.16 premium sidebar backdrop patch
        run: python3 .github/scripts/v316_patch.py
      - name: Apply Guide v3.17 Firebase profile avatar patch
        run: python3 .github/scripts/v317_patch.py

      - name: Apply Guide v3.18 reliable alarms and Bengali audio UX patch
        shell: bash
        run: |
          python3 .github/scripts/v318_patch.py || python3 .github/scripts/v318_recover.py
          python3 .github/scripts/v318_compile_fix.py

      - name: Apply Guide v3.19 scroll volume and alarm icon fixes
        run: python3 .github/scripts/v319_patch.py
      - name: Apply Guide v3.20 next alarm controls and notification actions
        run: python3 .github/scripts/v320_patch.py
      - name: Apply Guide v3.20 receiver scope compile fix
        run: python3 .github/scripts/v320_compile_fix.py
      - name: Apply Guide v3.21 finance center and Room/Mess accounting
        run: python3 .github/scripts/v321_patch.py
      - name: Apply Guide v3.22 Room/Mess paid status and fair rent splitting
        run: python3 .github/scripts/v322_patch.py
      - name: Apply Guide v3.23 separated Rent Mess and member completion UI
        run: python3 .github/scripts/v323_patch.py

      - name: Apply Guide v3.24 simple Room/Mess payments and PDF sharing
        shell: bash
        run: |
          python3 .github/scripts/v324_patch.py
          python3 .github/scripts/v324_compile_fix.py

      - name: Apply Guide v3.25 partial payment premium UI and scroll retention
        shell: bash
        run: |
          python3 .github/scripts/v325_prepare.py
          python3 .github/scripts/v325_patch.py

      - name: Apply Guide v3.26 active cycle history and month PDF
        shell: bash
        run: |
          python3 .github/scripts/v326_patch.py
          python3 .github/scripts/v326_compile_fix.py

      - name: Apply Guide v3.27 visible member controls and sidebar history
        run: python3 .github/scripts/v327_patch.py
      - name: Apply Guide v3.28 expense groups clear history and individual PDF
        run: python3 .github/scripts/v328_patch.py
      - name: Apply Guide v3.29 History PDF feedback offline UX and dashboard
        shell: bash
        run: python3 .github/scripts/v329_patch.py || python3 .github/scripts/v329_recover.py
      - name: Apply Guide v3.30 Saudi Arabic learning center
        run: python3 .github/scripts/v330_patch.py
      - name: Apply Guide v3.31 Saudi Arabic A-Z conversation expansion
        shell: bash
        run: |
          python3 .github/scripts/v331_patch.py
          python3 .github/scripts/v331_compile_fix.py
      - name: Apply Guide v3.32 Saudi Arabic mega library and anchor scroll fix
        shell: bash
        run: |
          python3 .github/scripts/v332_mega_generate.py
          python3 .github/scripts/v332_patch.py
          python3 .github/scripts/v332_compile_fix.py
      - name: Apply Guide v3.33 responsive fast UI patch
        run: python3 .github/scripts/v333_patch.py
      - name: Apply Guide v3.34 Islamic Audio Center
        run: python3 .github/scripts/v334_patch.py
      - name: Apply Guide v3.35 built-in Waz library
        run: python3 .github/scripts/v335_patch.py
      - name: Apply Guide v3.36 reversible completion and payment corrections
        run: python3 .github/scripts/v336_patch.py
      - name: Apply Guide v3.37 offline Islamic audio downloads
        run: python3 .github/scripts/v337_patch.py
      - name: Apply Guide v3.38 Smart expense note calculator
        run: python3 .github/scripts/v338_patch.py

      - name: Download CC0 and public-domain bundled adhan audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/raw
          curl --fail --location --retry 3 --silent --show-error \
            'https://upload.wikimedia.org/wikipedia/commons/b/b0/Beautiful_adhan.ogg' \
            --output app/src/main/res/raw/guide_adhan_beautiful.ogg
          curl --fail --location --retry 3 --silent --show-error \
            'https://upload.wikimedia.org/wikipedia/commons/a/a9/Muslim_calling_to_prayer.ogg' \
            --output app/src/main/res/raw/guide_adhan_clear.ogg
          curl --fail --location --retry 3 --silent --show-error \
            'https://upload.wikimedia.org/wikipedia/commons/1/1f/Oraci%C3%B3n_Al-Azzan.ogg' \
            --output app/src/main/res/raw/guide_adhan_short.ogg
          test -s app/src/main/res/raw/guide_adhan_beautiful.ogg
          test -s app/src/main/res/raw/guide_adhan_clear.ogg
          test -s app/src/main/res/raw/guide_adhan_short.ogg
          ls -lh app/src/main/res/raw/guide_adhan_*.ogg

      - name: Prepare stable beta signing key
        shell: bash
        run: |
          base64 -d .github/keys/guide-beta-keystore.b64 > "$RUNNER_TEMP/guide-beta.jks"
          echo "GUIDE_BETA_KEYSTORE=$RUNNER_TEMP/guide-beta.jks" >> "$GITHUB_ENV"
          echo "GUIDE_BETA_STORE_PASSWORD=guidebeta2026" >> "$GITHUB_ENV"
          echo "GUIDE_BETA_KEY_ALIAS=guidebeta" >> "$GITHUB_ENV"
          echo "GUIDE_BETA_KEY_PASSWORD=guidebeta2026" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Show beta signing SHA-1 for Google Login
        shell: bash
        run: |
          echo "Guide beta signing certificate fingerprint:"
          keytool -list -v \
            -keystore "$GUIDE_BETA_KEYSTORE" \
            -alias "$GUIDE_BETA_KEY_ALIAS" \
            -storepass "$GUIDE_BETA_STORE_PASSWORD" \
            -keypass "$GUIDE_BETA_KEY_PASSWORD" | grep -E 'SHA1:|SHA-1:'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Guide 3.38 stable beta APK
        run: gradle --no-daemon assembleDebug

      - name: Upload Guide 3.38 APK
        uses: actions/upload-artifact@v4
        with:
          name: guide-v3.38-stable-beta-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
