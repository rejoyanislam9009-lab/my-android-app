name: Build Guide v2 APK

on:
  push:
    branches:
      - feature/guide-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && 'feature/guide-v2' || github.ref }}
          fetch-depth: 0

      - name: Apply one-time v2.5 MainActivity patch
        if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[v25-main]') }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/guide/app/MainActivity.kt')
          s = p.read_text()
          def rep(old, new, name, count=1):
              global s
              if old not in s:
                  raise SystemExit(f'pattern not found: {name}')
              s = s.replace(old, new, count)

          rep('import android.app.AlarmManager\n', 'import android.app.AlarmManager\nimport android.app.NotificationManager\n', 'notification import')
          rep('import android.location.LocationManager\n', 'import android.location.Location\nimport android.location.LocationListener\nimport android.location.LocationManager\n', 'location imports')
          rep('import android.os.Bundle\n', 'import android.os.Bundle\nimport android.os.CancellationSignal\n', 'cancellation import')
          rep('import android.view.Gravity\n', 'import android.view.Gravity\nimport android.view.KeyEvent\n', 'key import')
          rep('    private var clockView: TextView? = null\n', '    private var clockView: TextView? = null\n    private var prayerCountdownView: TextView? = null\n', 'prayer field')
          rep('        ReminderScheduler.scheduleAll(this, store)\n        requestNotificationsIfNeeded()\n', '        ReminderScheduler.scheduleAll(this, store)\n        GuideBackupManager.autoBackupIfNeeded(this, store)\n        requestNotificationsIfNeeded()\n', 'create backup')
