    private fun nextPrayerForDashboard(): Pair<PrayerMoment, LocalDateTime>? {
        val settings = store.prayerSettings(); if (!settings.hasLocation()) return null
        val now = LocalDateTime.now()
        repeat(2) { offset ->
            val date = LocalDate.now().plusDays(offset.toLong())
            PrayerTimeCalculator.calculate(date, settings.latitude, settings.longitude, ZoneId.systemDefault()).filter { it.key != "Sunrise" }.forEach { prayer ->
                val target = LocalDateTime.of(date, prayer.time); if (target.isAfter(now)) return prayer to target
            }
        }
        return null
    }

    private fun updatePrayerCountdown() {
        val next = nextPrayerForDashboard()
        if (next == null) { prayerCountdownView?.text = "লোকেশন সেট করলে পরবর্তী নামাজের countdown দেখাবে"; return }
        val seconds = Duration.between(LocalDateTime.now(), next.second).seconds.coerceAtLeast(0)
        val h = seconds / 3600; val m = (seconds % 3600) / 60; val sec = seconds % 60
        prayerCountdownView?.text = "পরবর্তী ${next.first.nameBn} • ${h}ঘ ${m.toString().padStart(2, '0')}মি ${sec.toString().padStart(2, '0')}সে বাকি"
    }''', 'countdown')
