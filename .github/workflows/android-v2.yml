name: Build Guide v2 APK

on:
  push:
    branches:
      - feature/guide-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/guide-v2
          fetch-depth: 0

      - name: Apply v2.5 source patch if needed
        shell: bash
        run: |
          if [ -f .github/scripts/v25_patch.py ]; then
            python3 .github/scripts/v25_patch.py
          fi
          if ! git diff --quiet -- app/src/main/java/com/guide/app/MainActivity.kt; then
            git config user.name "guide-build-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -- app/src/main/java/com/guide/app/MainActivity.kt
            git commit -m "feat: finish Guide v2.5 UI and location fixes [v25-main]"
            git push origin HEAD:feature/guide-v2
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guide-v2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
