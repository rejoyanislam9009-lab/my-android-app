name: Build Guide v2 APK

on:
  push:
    branches:
      - feature/guide-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply Guide v2.5 source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/v25_patch.py')
          s = p.read_text()
          start = "rep('        labels.addView(text(record.status, 15f,"
          if start in s:
              line_start = s.index(start)
              line_end = s.index("\n", line_start)
              s = s[:line_start] + "s = s.replace('labels.addView(text(record.status, 15f', 'labels.addView(text(statusBn(record.status), 15f', 1)" + s[line_end:]
              p.write_text(s)
          PY
          python3 .github/scripts/v25_patch.py

      - name: Apply Guide v2.7 auth and sidebar patch
        run: python3 .github/scripts/v27_patch.py

      - name: Apply Guide v2.8 dashboard banner patch
        run: python3 .github/scripts/v28_patch.py

      - name: Apply Guide v2.9 daily life patch
        run: python3 .github/scripts/v29_patch.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Guide 2.9 debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload Guide 2.9 APK
        uses: actions/upload-artifact@v4
        with:
          name: guide-v2.9-daily-life-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
