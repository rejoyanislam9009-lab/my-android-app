    private fun useCurrentPrayerLocation() {
        val fine = ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED
        val coarse = ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED
        if (!fine && !coarse) {
            ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION), 441)
            return
        }
        val manager = getSystemService(LOCATION_SERVICE) as LocationManager
        val providers = listOf(LocationManager.GPS_PROVIDER, LocationManager.NETWORK_PROVIDER, LocationManager.PASSIVE_PROVIDER)
        val location = providers.mapNotNull { provider -> runCatching { manager.getLastKnownLocation(provider) }.getOrNull() }.maxByOrNull { it.time }
        if (location == null) {
            Toast.makeText(this, "ফোনের Location চালু করে আবার চেষ্টা করুন, অথবা হাতে লিখুন", Toast.LENGTH_LONG).show()
            return
        }
        store.setPrayerLocation(location.latitude, location.longitude)
        store.setPrayerEnabled(true)
        ReminderScheduler.scheduleAll(this, store)
        Toast.makeText(this, "লোকেশন সেভ হয়েছে", Toast.LENGTH_SHORT).show()
        render()
    }''', '''    private fun ringtoneTitle(uri: String): String {
        if (uri.isBlank()) return "ফোনের ডিফল্ট অ্যালার্ম"
        if (uri == "builtin://azan-soft") return "বিল্ট-ইন আজান অ্যালার্ট ১ • শান্ত"
        if (uri == "builtin://azan-classic") return "বিল্ট-ইন আজান অ্যালার্ট ২ • জোরালো"
        return runCatching { RingtoneManager.getRingtone(this, Uri.parse(uri))?.getTitle(this) ?: "নির্বাচিত রিংটোন" }.getOrDefault("নির্বাচিত রিংটোন")
    }

    private fun chooseBuiltInAzan() {
        AlertDialog.Builder(this).setTitle("বিল্ট-ইন আজান অ্যালার্ট")
            .setItems(arrayOf("আজান অ্যালার্ট ১ • শান্ত", "আজান অ্যালার্ট ২ • জোরালো", "ফোনের ডিফল্ট অ্যালার্ম")) { _, which ->
                store.setPrayerAzanUri(when (which) { 0 -> "builtin://azan-soft"; 1 -> "builtin://azan-classic"; else -> "" })
                ReminderScheduler.scheduleAll(this, store); render()
            }.show()
    }

    private fun useCurrentPrayerLocation() {
        val fine = ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED
        val coarse = ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED
        if (!fine && !coarse) {
            ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION), 441)
            return
        }
        requestFreshPrayerLocation()
    }

    private fun requestFreshPrayerLocation() {
        val manager = getSystemService(LOCATION_SERVICE) as LocationManager
        val providers = listOf(LocationManager.NETWORK_PROVIDER, LocationManager.GPS_PROVIDER).filter { runCatching { manager.isProviderEnabled(it) }.getOrDefault(false) }
        if (providers.isEmpty()) {
            Toast.makeText(this, "Location চালু করুন, তারপর আবার চেষ্টা করুন", Toast.LENGTH_LONG).show()
            runCatching { startActivity(Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS)) }; return
        }
        Toast.makeText(this, "বর্তমান লোকেশন নেওয়া হচ্ছে…", Toast.LENGTH_SHORT).show()
        fun saveLocation(location: Location?) {
            val fallback = location ?: providers.mapNotNull { runCatching { manager.getLastKnownLocation(it) }.getOrNull() }.maxByOrNull { it.time }
            if (fallback == null) { Toast.makeText(this, "লোকেশন পাওয়া যায়নি। কয়েক সেকেন্ড পরে আবার চেষ্টা করুন।", Toast.LENGTH_LONG).show(); return }
            store.setPrayerLocation(fallback.latitude, fallback.longitude); store.setPrayerEnabled(true)
            ReminderScheduler.scheduleAll(this, store); GuideBackupManager.autoBackupIfNeeded(this, store, force = true)
            Toast.makeText(this, "বর্তমান লোকেশন অটোমেটিক সেভ হয়েছে", Toast.LENGTH_SHORT).show(); render()
        }
        val provider = providers.first()
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
            runCatching { manager.getCurrentLocation(provider, CancellationSignal(), mainExecutor) { saveLocation(it) } }.onFailure { saveLocation(null) }
        } else {
            val listener = object : LocationListener {
                override fun onLocationChanged(location: Location) { runCatching { manager.removeUpdates(this) }; saveLocation(location) }
                override fun onProviderEnabled(provider: String) = Unit
                override fun onProviderDisabled(provider: String) = Unit
                @Deprecated("Deprecated in Android") override fun onStatusChanged(provider: String?, status: Int, extras: Bundle?) = Unit
            }
            runCatching { manager.requestSingleUpdate(provider, listener, Looper.getMainLooper()) }.onFailure { saveLocation(null) }
            handler.postDelayed({ runCatching { manager.removeUpdates(listener) }; if (!store.prayerSettings().hasLocation()) saveLocation(null) }, 8_000L)
        }
    }''', 'location')
