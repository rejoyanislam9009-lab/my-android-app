name: Check Guide Firebase v2.6

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  firebase-v26:
    if: ${{ github.head_ref == 'feature/guide-v2' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Guide feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/guide-v2

      - name: Apply Guide v2.5 UI patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/v25_patch.py')
          s = p.read_text()
          start = "rep('        labels.addView(text(record.status, 15f,"
          if start in s:
              line_start = s.index(start)
              line_end = s.index("\n", line_start)
              s = s[:line_start] + "s = s.replace('labels.addView(text(record.status, 15f', 'labels.addView(text(statusBn(record.status), 15f', 1)" + s[line_end:]
              p.write_text(s)
          PY
          python3 .github/scripts/v25_patch.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Guide Firebase APK
        run: gradle --no-daemon assembleDebug

      - name: Upload Guide Firebase APK
        uses: actions/upload-artifact@v4
        with:
          name: guide-v2.6-firebase-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
